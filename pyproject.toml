    [project]
name = "film-catalogue-warehouse"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.0",
]
    [build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

    [tool.hatch.build.targets.wheel]
packages = ["src/filmwh"]

[project.scripts]
filmwh = "filmwh.cli:main"
