[project]
name = "film-catalogue-warehouse"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "dbt-core>=1.12.6,<2",
    "dbt-postgres>=1.11.0,<2",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filmwh"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[project.scripts]
filmwh = "filmwh.cli:main"
