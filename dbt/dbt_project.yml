
name: 'filmwh'
version: '1.0.0'
require-dbt-version: [">=1.12.0", "<2.0.0"]

# This setting configures which "profile" dbt uses for this project.
profile: 'filmwh'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"



models:
  filmwh:
    staging:
      +materialized: view
      +schema: staging
