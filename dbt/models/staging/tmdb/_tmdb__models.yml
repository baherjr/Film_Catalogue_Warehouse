models:
  - name: stg_tmdb__movie_ids_daily
    description: "TMDB's daily movie ID exports, one view row per raw row. Grain: one row per movie per day it appears in TMDB's daily movie ID export."
    columns:
      - name: snapshot_date
        description: "Date of the export file."
      - name: movie_id
        description: "TMDB film id."
      - name: is_adult
        description: "Whether TMDB flags the film as adult content. Nullable: TMDB sends nulls for some films."
      - name: original_title
        description: "The film's title in its original language."
      - name: popularity
        description: >
          TMDB's popularity score for the film on snapshot_date. It has no units and is
          recalculated daily, so it's meaningful for comparing films against each other
          and as a trend for one film over time.
      - name: is_video
        description: "Whether TMDB flags the entry as a video release rather than a theatrical film. Nullable: TMDB sends nulls for some films."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [snapshot_date, movie_id]
          config:
            where: "snapshot_date >= current_date - 1"

  - name: stg_tmdb__movie_details
    description: "TMDB film details, one view row per raw row. Grain: one row per distinct version of a film's TMDB details payload."
    columns:
      - name: movie_id
        description: "TMDB film id."
        data_tests:
          - not_null
      - name: payload_sha256
        description: "SHA-256 hex digest of the raw payload. Identifies the version of the film's details."
        data_tests:
          - not_null
      - name: fetched_at
        description: "When the payload was fetched from the TMDB API (UTC)."
        data_tests:
          - not_null
      - name: title
        description: "The film's title as TMDB displays it."
      - name: original_title
        description: "The film's title in its original language."
      - name: original_language
        description: "ISO 639-1 code of the film's original language."
      - name: status
        description: "TMDB release status, e.g. Released, Post Production, Rumored."
        data_tests:
          - accepted_values:
              arguments:
                values: ["Rumored", "Planned", "In Production", "Post Production", "Released", "Canceled"]
      - name: imdb_id
        description: "The film's IMDb id. Nullable: not every film has one."
      - name: release_date
        description: "The film's primary release date. NULL when TMDB has no date."
      - name: budget
        description: "Production budget in US dollars. NULL when TMDB has no budget (it sends 0)."
      - name: revenue
        description: "Box office revenue in US dollars. NULL when TMDB has no revenue (it sends 0)."
      - name: runtime
        description: "Running time in minutes. NULL when TMDB has no runtime (it sends 0)."
      - name: vote_average
        description: "TMDB's average user rating, 0 to 10. NULL when the film has no votes."
      - name: vote_count
        description: "Number of TMDB user votes. 0 when the film has no votes."
      - name: is_latest
        description: >
          Whether this row is the film's most recently fetched version. Exactly one row
          per movie_id is true (checked by assert_one_latest_version_per_movie).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [movie_id, payload_sha256]

  - name: stg_tmdb__movie_cast
    description: "Cast credits unnested from each film's latest details payload. Grain: one row per cast credit, from each film's latest payload."
    columns:
      - name: credit_id
        description: "TMDB credit id. Identifies one person's credit on one film."
        data_tests:
          - not_null
          - unique
      - name: movie_id
        description: "TMDB film id."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tmdb__movie_details')
                field: movie_id
      - name: person_id
        description: "TMDB person id."
        data_tests:
          - not_null
      - name: person_name
        description: "The person's name as TMDB displays it."
      - name: character_name
        description: "The character played. Empty for some credits."
      - name: billing_order
        description: "Position in the film's billing, 0 = top-billed."
        data_tests:
          - not_null
      - name: known_for_department
        description: "The department TMDB associates the person with, e.g. Acting."

  - name: stg_tmdb__movie_crew
    description: "Crew credits unnested from each film's latest details payload. Grain: one row per crew credit, from each film's latest payload. The same person can appear several times for one film, once per job."
    columns:
      - name: credit_id
        description: "TMDB credit id. Identifies one person's credit on one film."
        data_tests:
          - not_null
          - unique
      - name: movie_id
        description: "TMDB film id."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tmdb__movie_details')
                field: movie_id
      - name: person_id
        description: "TMDB person id."
        data_tests:
          - not_null
      - name: person_name
        description: "The person's name as TMDB displays it."
      - name: department
        description: "Department of this credit, e.g. Directing, Writing, Production."
      - name: job
        description: "The person's job title for this credit, e.g. Director, Screenplay, Producer."
